name: update-and-deploy
on:
  schedule:
    - cron: '30 22 * * 1-5'   # UTC 22:30 週一~五 = 台北 06:30 週二~六（美股收盤後）
  workflow_dispatch:
  push:
    branches: [main]
    # backtest/ 是手動觸發的一次性作業，推它的產出不該連帶跑一次每日更新
    paths-ignore: ['data.json', 'backtest/**']
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests yfinance
      - name: update data (failures keep old values)
        run: python scripts/update_data.py
      - name: commit refreshed data
        run: |
          git config user.name "ai-bubble-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data: auto update $(date -u +%F)"
          git push
      - name: request pages rebuild
        # GITHUB_TOKEN 推送不會自動觸發 Pages 佈建（防迴圈），改用 API 明確要求重建
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            && echo "pages rebuild requested" \
            || echo "pages rebuild request failed (non-fatal)"
