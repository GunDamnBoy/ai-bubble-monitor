name: update-and-deploy
on:
  schedule:
    - cron: '30 22 * * 1-5'   # UTC 22:30 週一~五 = 台北 06:30 週二~六（美股收盤後）
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data.json']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests yfinance
      - name: update data (failures keep old values)
        run: python scripts/update_data.py
      - name: commit refreshed data
        run: |
          git config user.name "ai-bubble-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data: auto update $(date -u +%F)"
          git push
